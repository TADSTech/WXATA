version: '3.9'

services:
  wxata:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 5000
    container_name: wxata
    restart: unless-stopped          # Docker restarts on crash; PM2 handles in-process restarts
    ports:
      - "5000:5000"                  # WebSocket + HTTP health endpoint
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      DB_RETENTION_DAYS: "3"
      # Set this to your Oracle public IP or domain after deployment:
      # RENDER_EXTERNAL_URL: "http://YOUR_ORACLE_IP:5000"
    volumes:
      # Persistent data — survives container rebuilds and restarts
      - wxata_auth:/data/auth_info   # WhatsApp session keys
      - wxata_db:/data/db            # SQLite database
      - wxata_data:/data             # botinfo.json, warns.json, vars.json, antidel.json, antibc.json
      - wxata_logs:/app/logs         # PM2 log files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wxata_auth:
  wxata_db:
  wxata_data:
  wxata_logs:
