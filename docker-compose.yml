services:
  wxata:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: 5000
    container_name: wxata
    env_file:
      - backend/.env 
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      DB_RETENTION_DAYS: "3"
    volumes:
      - wxata_auth:/data/auth_info
      - wxata_db:/data/db
      - wxata_data:/data
      - wxata_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  wxata_auth:
  wxata_db:
  wxata_data:
  wxata_logs:
